<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kontak Waskara.">
  <title>Kontak — Waskara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">

<body>
<header class="site-header">
  <div class="navbar">
    <a class="logo" href="index.html">WASKARA</a>
    <nav class="desktop-nav" aria-label="Navigasi utama">
      <a href="index.html">Tulisan</a>
      <a href="about.html">Tentang</a>
      <a class="active" href="contact.html">Kontak</a>
    </nav>
    <div class="navbar-right">
      <button class="search-pill" id="searchButton" type="button" aria-label="Cari tulisan">
        <span class="search-icon" aria-hidden="true"></span><span>Cari</span>
      </button>
      <button class="menu-button" id="menuToggle" type="button" aria-label="Buka menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </div>
  <nav class="mobile-menu" id="mobileMenu" aria-label="Navigasi seluler">
    <a href="index.html">Tulisan</a>
    <a href="about.html">Tentang</a>
    <a class="active" href="contact.html">Kontak</a>
  </nav>
</header>

<div class="search-overlay" id="searchOverlay" aria-hidden="true">
  <div class="search-box">
    <div class="search-input-wrapper">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="searchInput" type="search" placeholder="Cari tulisan..." autocomplete="off">
      <button id="closeCari" type="button">Esc</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<main class="simple-page contact-page">
  <div class="simple-content">
    <p class="eyebrow">KONTAK</p>
    <h1>Mari berbicara.</h1>
    <p class="contact-description">Punya sesuatu untuk disampaikan, ingin berbagi ide, atau sekadar ingin menyapa?</p>

    <form class="contact-form" action="mailto:ardanarx@gmail.com" method="post" enctype="text/plain">
      <div class="form-field">
        <label for="nama">Nama</label>
        <input id="nama" name="Nama" type="text" autocomplete="name" required placeholder="Nama kamu">
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="Email" type="email" autocomplete="email" required placeholder="nama@email.com">
      </div>
      <div class="form-field">
        <label for="subjek">Subjek</label>
        <input id="subjek" name="Subjek" type="text" required placeholder="Tentang apa?">
      </div>
      <div class="form-field">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="Pesan" required placeholder="Tulis pesan kamu di sini..."></textarea>
      </div>
      <button class="contact-submit" type="submit">Kirim pesan <span>→</span></button>
      <p class="contact-note">Form ini akan membuka aplikasi email kamu dan menyiapkan pesan ke ardanarx@gmail.com.</p>
    </form>
  </div>
</main>

<footer class="site-footer">
  <a class="logo" href="index.html">WASKARA</a>
  <span>2026</span>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
